let i=+localStorage.getItem("jcpp_i")||0, done=JSON.parse(localStorage.getItem("jcpp_done")||"{}");
function level(n){return levels[Math.min(7,Math.floor(n/25))]}
function save(){localStorage.setItem("jcpp_i",i);localStorage.setItem("jcpp_done",JSON.stringify(done))}
function render(){let q=qs[i],c=Object.values(done).filter(Boolean).length;document.getElementById("level").textContent=level(i);document.getElementById("qnum").textContent="Question "+q.id+" of 200";document.getElementById("question").textContent="Q"+q.id+". "+q.text;document.getElementById("doneCount").innerHTML="<b>"+c+"</b> / 200";document.getElementById("fill").style.width=(c/200*100)+"%";let b=document.getElementById("complete");b.textContent=done[q.id]?"✓ Completed":"✓ Mark Completed";b.classList.toggle("green",true);document.getElementById("status").textContent=done[q.id]?"✓ Done":"";filterGrid()}
function toggle(){let id=qs[i].id;done[id]=!done[id];save();render()}
function next(){if(i<199){i++;save();render()}}
function prev(){if(i>0){i--;save();render()}}
function jump(n){i=n;save();render()}
function filterGrid(){let s=document.getElementById("search").value.toLowerCase(),g=document.getElementById("grid");g.innerHTML="";qs.forEach((q,k)=>{if(s && !(q.text.toLowerCase().includes(s)||String(q.id).includes(s)))return;let b=document.createElement("button");b.className="num"+(done[q.id]?" done":"")+(k===i?" current":"");b.textContent=q.id;b.onclick=()=>{i=k;save();render()};g.appendChild(b)})}
async function openVSCode(){
  let id=qs[i].id;
  let question=qs[i].text;

  try{
    let r=await fetch("/open?id="+id+"&question="+encodeURIComponent(question));
    let t=await r.text();

    if(!r.ok){
      alert("VS Code error: "+t);
    }else{
      document.getElementById("status").textContent="✓ Q"+id+" opened in VS Code";
    }
  }catch(e){
    alert("Start the app with Start_JaiveerCPP.bat first. Do not open index.html directly.");
  }
}render();
